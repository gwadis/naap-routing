services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: naap_app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    environment:
      APP_NAME: "${APP_NAME:-NAAP Routing}"
      APP_ENV: "${APP_ENV:-production}"
      APP_KEY: "${APP_KEY}"
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_URL: "${APP_URL:-http://localhost:8000}"
      APP_TIMEZONE: "${APP_TIMEZONE:-Asia/Manila}"
      DB_CONNECTION: "${DB_CONNECTION:-mysql}"
      DB_HOST: "${DB_HOST:-mysql}"
      DB_PORT: "${DB_PORT:-3306}"
      DB_DATABASE: "${DB_DATABASE:-naap_routing}"
      DB_USERNAME: "${DB_USERNAME:-naap_user}"
      DB_PASSWORD: "${DB_PASSWORD:-naap_secret}"
      RUN_MIGRATIONS: "${RUN_MIGRATIONS:-true}"
      RUN_SEEDER: "${RUN_SEEDER:-false}"
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - storage_data:/var/www/html/storage
    networks:
      - naap_network

  mysql:
    image: mysql:8.0
    container_name: naap_mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:-naap_routing}"
      MYSQL_USER: "${DB_USERNAME:-naap_user}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-naap_secret}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-root_secret}"
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "${FORWARD_DB_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${DB_ROOT_PASSWORD:-root_secret} || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - naap_network

volumes:
  mysql_data:
    driver: local
  storage_data:
    driver: local

networks:
  naap_network:
    driver: bridge
